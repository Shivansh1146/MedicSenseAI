<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark-mode">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        const storageKey = "medicsense_dark_mode";
        const storedTheme = localStorage.getItem(storageKey);
        // Default to dark mode if no preference is saved
        const isDark = storedTheme === null ? true : storedTheme === "1";
        document.documentElement.setAttribute(
          "data-theme",
          isDark ? "dark" : "light"
        );
        if (isDark) {
          document.documentElement.classList.add("dark-mode");
        } else {
          document.documentElement.classList.remove("dark-mode");
        }
        // Save the default preference
        if (storedTheme === null) {
          localStorage.setItem(storageKey, "1");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Appointments - MedicSense AI</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style_ultra.css" />
    <style>
      body {
        padding-top: 0 !important;
      }

      .apt-page-container {
        min-height: 100vh;
        background: var(--bg-page);
        padding: 2rem;
      }

      .apt-back-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-main);
        text-decoration: none;
        font-weight: 600;
        margin-bottom: 1.5rem;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        transition: all 0.2s;
        font-size: 0.95rem;
        background: var(--bg-card);
        border: 1px solid var(--gray-200);
      }

      .apt-back-btn:hover {
        background: var(--primary-50);
        color: var(--primary-600);
        border-color: var(--primary-300);
      }

      .apt-content-section {
        background: var(--bg-card);
        border-radius: 20px;
        padding: 2rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .apt-section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .apt-section-header h2 {
        color: var(--text-main);
        margin: 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.25rem;
      }

      .cancel-all-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 1.25rem;
        background: transparent;
        border: 1.5px solid #ef4444;
        color: #ef4444;
        border-radius: 8px;
        font-size: 0.8125rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: inherit;
      }

      .cancel-all-btn:hover {
        background: #ef4444;
        color: white;
        box-shadow: 0 3px 10px rgba(239, 68, 68, 0.25);
        transform: translateY(-1px);
      }

      .cancel-all-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        pointer-events: none;
      }

      .apt-filter-tabs {
        display: flex;
        gap: 0.625rem;
        margin-bottom: 1.75rem;
        flex-wrap: wrap;
      }

      .apt-filter-tab {
        padding: 0.5rem 1.25rem;
        border: 1.5px solid rgba(148, 163, 184, 0.35);
        background: rgba(255, 255, 255, 0.04);
        border-radius: 999px;
        cursor: pointer;
        transition: all 0.2s;
        font-weight: 600;
        color: #94a3b8;
        font-size: 0.875rem;
        font-family: inherit;
      }

      [data-theme="light"] .apt-filter-tab {
        border-color: #e2e8f0;
        background: #f8fafc;
        color: #64748b;
      }

      .apt-filter-tab:hover {
        border-color: #667eea;
        color: #a5b4fc;
      }

      [data-theme="light"] .apt-filter-tab:hover {
        color: #667eea;
      }

      .apt-filter-tab.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-color: transparent;
        box-shadow: 0 4px 14px rgba(102, 126, 234, 0.35);
      }

      .apt-filter-tab .tab-count {
        background: rgba(0, 0, 0, 0.08);
        padding: 1px 7px;
        border-radius: 10px;
        font-size: 0.75rem;
        margin-left: 0.35rem;
      }

      .apt-filter-tab.active .tab-count {
        background: rgba(255, 255, 255, 0.25);
      }

      .apt-list {
        display: flex;
        flex-direction: column;
        gap: 0.875rem;
      }

      /* Full-width cards on this page */
      .apt-page-container .appointment-card {
        max-width: 100%;
        width: 100%;
        align-items: center;
        padding: 1rem 1.25rem;
        gap: 1rem;
        margin-bottom: 0;
      }

      .apt-page-container .appointment-card .appointment-info h4 {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-main);
        font-size: 1rem;
      }

      .apt-page-container .appointment-card .appointment-info h4 i {
        color: #818cf8;
        font-size: 0.9rem;
      }

      .apt-page-container .appointment-date {
        font-size: 0.875rem;
        color: var(--text-muted, #94a3b8);
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex-wrap: wrap;
      }

      .apt-page-container .appointment-actions {
        align-self: center;
        min-width: 110px;
        justify-content: flex-end;
        flex-shrink: 0;
      }

      .apt-page-container .status-badge.cancelled {
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
        border-color: rgba(239, 68, 68, 0.35);
      }

      .apt-page-container .status-badge.confirmed {
        background: rgba(59, 130, 246, 0.15);
        color: #93c5fd;
        border-color: rgba(59, 130, 246, 0.35);
      }

      .apt-page-container .cancel-btn {
        min-width: 90px;
        text-align: center;
        border-color: #f87171;
        color: #fca5a5;
      }

      .apt-page-container .cancel-btn:hover {
        background: #ef4444;
        color: #fff;
      }

      .apt-status-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        min-width: 90px;
        padding: 7px 16px;
        font-size: 0.8125rem;
        font-weight: 600;
        font-style: normal;
        border-radius: 8px;
        white-space: nowrap;
        font-family: inherit;
      }

      .apt-status-chip--cancelled {
        color: #fca5a5;
        border: 1.5px solid rgba(248, 113, 113, 0.35);
        background: rgba(239, 68, 68, 0.08);
      }

      .apt-status-chip--completed {
        color: #94a3b8;
        border: 1.5px solid rgba(148, 163, 184, 0.3);
        background: rgba(148, 163, 184, 0.08);
      }

      .apt-empty-state {
        text-align: center;
        padding: 3rem 2rem;
        color: #94a3b8;
      }

      .apt-empty-state i {
        font-size: 3rem;
        margin-bottom: 0.75rem;
        color: #cbd5e1;
        display: block;
      }

      .apt-empty-state h3 {
        color: #64748b;
        margin: 0 0 0.35rem 0;
        font-size: 1.1rem;
      }

      .apt-empty-state p {
        margin: 0;
        font-size: 0.9rem;
      }

      .apt-book-cta {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1rem;
        padding: 0.75rem 1.5rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        font-size: 0.9rem;
        transition: all 0.2s;
      }

      .apt-book-cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
      }

      /* === Toast === */
      #aptToast {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        min-width: 240px;
        max-width: 360px;
        padding: 12px 18px;
        border-radius: 12px;
        font-size: 0.9rem;
        font-weight: 500;
        color: #fff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        z-index: 9999;
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.3s, transform 0.3s;
        pointer-events: none;
      }
      #aptToast.show {
        opacity: 1;
        transform: translateY(0);
      }
      #aptToast.success {
        background: #10b981;
      }
      #aptToast.error {
        background: #ef4444;
      }
      #aptToast.info {
        background: #667eea;
      }

      /* === Confirm Dialog === */
      #aptConfirmOverlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 9990;
        align-items: center;
        justify-content: center;
      }
      #aptConfirmOverlay.show {
        display: flex;
      }
      #aptConfirmBox {
        background: var(--bg-card);
        border-radius: 16px;
        padding: 2rem;
        max-width: 380px;
        width: 90%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        text-align: center;
      }
      #aptConfirmBox p {
        color: var(--text-main, #374151);
        margin: 0 0 1.5rem;
        line-height: 1.6;
        font-size: 0.95rem;
      }
      .confirm-actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
      }
      .confirm-btn-yes {
        padding: 0.6rem 1.5rem;
        background: #ef4444;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        font-family: inherit;
      }
      .confirm-btn-yes:hover {
        background: #dc2626;
      }
      .confirm-btn-no {
        padding: 0.6rem 1.5rem;
        background: #e2e8f0;
        color: #374151;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        font-family: inherit;
      }
      .confirm-btn-no:hover {
        background: #cbd5e1;
      }

      @media (max-width: 768px) {
        .apt-page-container {
          padding: 1rem;
        }
        .apt-content-section {
          padding: 1.25rem;
        }
        .apt-page-container .appointment-card {
          flex-direction: column;
          align-items: stretch;
        }
        .apt-page-container .appointment-actions {
          justify-content: flex-start;
          min-width: 0;
        }
      }

      .apt-soon-label {
        color: #fbbf24;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        animation: pulse 2s infinite;
      }
      .apt-completed-label {
        color: #94a3b8;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .apt-date-sep {
        opacity: 0.5;
        margin: 0 0.15rem;
      }
      @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.7; }
        100% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="apt-page-container">
      <a href="index.html#appointments" class="apt-back-btn">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
      </a>

      <!-- Content -->
      <div class="apt-content-section">
        <div class="apt-section-header">
          <h2><i class="fas fa-list-alt"></i> All Appointments</h2>
          <button
            class="cancel-all-btn"
            id="cancelAllBtn"
            onclick="cancelAllAppointments()"
          >
            <i class="fas fa-times-circle"></i> Cancel All Confirmed
          </button>
        </div>

        <div class="apt-filter-tabs" id="filterTabs">
          <button class="apt-filter-tab active" data-filter="all">
            All <span class="tab-count" id="countAll">0</span>
          </button>
          <button class="apt-filter-tab" data-filter="confirmed">
            Confirmed <span class="tab-count" id="countConfirmed">0</span>
          </button>
          <button class="apt-filter-tab" data-filter="cancelled">
            Cancelled <span class="tab-count" id="countCancelled">0</span>
          </button>
        </div>

        <div class="apt-list" id="appointmentList">
          <div class="apt-empty-state">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading appointments...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast & Confirm Dialog -->
    <div id="aptToast"></div>
    <div id="aptConfirmOverlay">
      <div id="aptConfirmBox">
        <p id="aptConfirmMsg">Are you sure?</p>
        <div class="confirm-actions">
          <button class="confirm-btn-no" id="aptConfirmNo">Cancel</button>
          <button class="confirm-btn-yes" id="aptConfirmYes">
            Yes, Confirm
          </button>
        </div>
      </div>
    </div>

    <!-- Config - auto-detects local vs production -->
    <script src="config.js"></script>
    <script>
      const CONFIG = {
        API_BASE_URL: window.ENV.API_BASE_URL,
      };

      let appointments = [];
      let activeFilter = "all";

      function getUserId() {
        const persisted = localStorage.getItem("medicsense_user_id");
        if (persisted && persisted !== "null" && persisted !== "undefined") {
          return persisted;
        }
        const guestId = `guest_${Math.random()
          .toString(36)
          .slice(2, 10)}${Date.now().toString(36)}`;
        localStorage.setItem("medicsense_user_id", guestId);
        return guestId;
      }

      // === Toast ===
      let _toastTimer;
      function showToast(msg, type = "info") {
        const t = document.getElementById("aptToast");
        t.textContent = msg;
        t.className = `show ${type}`;
        clearTimeout(_toastTimer);
        _toastTimer = setTimeout(() => (t.className = ""), 3500);
      }

      // === Custom Confirm ===
      function aptConfirm(msg) {
        return new Promise((resolve) => {
          document.getElementById("aptConfirmMsg").textContent = msg;
          const overlay = document.getElementById("aptConfirmOverlay");
          overlay.classList.add("show");
          const yes = document.getElementById("aptConfirmYes");
          const no = document.getElementById("aptConfirmNo");
          const cleanup = (val) => {
            overlay.classList.remove("show");
            yes.replaceWith(yes.cloneNode(true));
            no.replaceWith(no.cloneNode(true));
            resolve(val);
          };
          document
            .getElementById("aptConfirmYes")
            .addEventListener("click", () => cleanup(true), { once: true });
          document
            .getElementById("aptConfirmNo")
            .addEventListener("click", () => cleanup(false), { once: true });
        });
      }

      function dedupeAppointments(list) {
        const seen = new Set();
        return list.filter((apt) => {
          const key = String(apt.id);
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      function getAppointmentDate(apt) {
        const dt =
          apt.datetime ||
          (apt.date ? `${apt.date}T${apt.time || "00:00"}:00` : null);
        if (!dt) return new Date(apt.created_at || 0);
        const parsed = new Date(dt);
        return isNaN(parsed.getTime()) ? new Date(apt.created_at || 0) : parsed;
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text || "";
        return div.innerHTML;
      }

      // ---- Formatting ----
      function formatAppointmentTime(dateString) {
        if (!dateString) return "No date set";
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return dateString;

        const timeStr = date.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
        const dateStr = date.toLocaleDateString([], {
          month: "short",
          day: "numeric",
          year: "numeric",
        });
        const detail = `${dateStr} at ${timeStr}`;

        const diff = date - new Date();
        const minutes = Math.floor(diff / 60000);
        const days = Math.floor(diff / 86400000);

        if (minutes > 0 && minutes < 60) {
          return `<span class="apt-soon-label"><i class="fas fa-clock"></i> Starting in ${minutes} min</span><span class="apt-date-sep">·</span>${detail}`;
        }

        if (diff < 0) {
          return `<span class="apt-completed-label"><i class="fas fa-check-circle"></i> Past visit</span><span class="apt-date-sep">·</span>${detail}`;
        }

        if (days === 0) {
          return `<strong>Today</strong><span class="apt-date-sep">·</span>${detail}`;
        }

        if (days === 1) {
          return `<strong>Tomorrow</strong><span class="apt-date-sep">·</span>${detail}`;
        }

        if (days > 1 && days < 7) {
          return `<strong>In ${days} days</strong><span class="apt-date-sep">·</span>${detail}`;
        }

        return detail;
      }

      function updateAppointmentTimes() {
        document.querySelectorAll(".appointment-date").forEach(el => {
          const time = el.dataset.time;
          if (time) {
            el.innerHTML = `<i class="fas fa-calendar-alt"></i> ${formatAppointmentTime(time)}`;
          }
        });
      }

      // Initialize on load and refresh every minute
      document.addEventListener("DOMContentLoaded", updateAppointmentTimes);
      setInterval(updateAppointmentTimes, 60000);

      // ---- Load Data ----
      async function loadAppointments() {
        const userId = getUserId();

        try {
          const res = await fetch(
            `${CONFIG.API_BASE_URL}/appointments?user_id=${encodeURIComponent(userId)}`
          );
          const data = await res.json();
          if (data.success && Array.isArray(data.data)) {
            appointments = dedupeAppointments(data.data);
            localStorage.setItem(
              "medicsense_appointments",
              JSON.stringify(appointments)
            );
            console.log("Synced appointments from server:", appointments.length);
          }
        } catch (err) {
          console.error(
            "Failed to sync from server, falling back to local storage:",
            err
          );
          try {
            const raw = localStorage.getItem("medicsense_appointments");
            if (raw) appointments = dedupeAppointments(JSON.parse(raw) || []);
          } catch (e) {
            console.error("Error loading appointments:", e);
            appointments = [];
          }
        }

        updateStats();
        renderAppointments();
      }

      // ---- Stats ----
      function updateStats() {
        const confirmed = appointments.filter(
          (a) => a.status === "confirmed"
        ).length;
        const cancelled = appointments.filter(
          (a) => a.status === "cancelled"
        ).length;
        const total = appointments.length;

        document.getElementById("countAll").textContent = total;
        document.getElementById("countConfirmed").textContent = confirmed;
        document.getElementById("countCancelled").textContent = cancelled;

        const cancelAllBtn = document.getElementById("cancelAllBtn");
        if (cancelAllBtn) {
          cancelAllBtn.disabled = confirmed === 0;
        }
      }

      function getActionHtml(apt, isPast) {
        if (apt.status === "cancelled") {
          return `<span class="apt-status-chip apt-status-chip--cancelled"><i class="fas fa-ban"></i> Cancelled</span>`;
        }
        if (apt.status === "confirmed" && !isPast) {
          return `<button class="cancel-btn" data-apt-id="${apt.id}">Cancel</button>`;
        }
        if (isPast) {
          return `<span class="apt-status-chip apt-status-chip--completed"><i class="fas fa-check"></i> Done</span>`;
        }
        return "";
      }

      // ---- Filter ----
      function getFilteredAppointments() {
        switch (activeFilter) {
          case "confirmed":
            return appointments.filter((a) => a.status === "confirmed");
          case "cancelled":
            return appointments.filter((a) => a.status === "cancelled");
          default:
            return [...appointments];
        }
      }

      // ---- Render ----
      function renderAppointments() {
        const listEl = document.getElementById("appointmentList");
        if (!listEl) return;
        listEl.innerHTML = "";

        const filtered = getFilteredAppointments().sort(
          (a, b) => getAppointmentDate(b) - getAppointmentDate(a)
        );

        if (filtered.length === 0) {
          listEl.innerHTML = `
            <div class="apt-empty-state">
              <i class="fas fa-calendar-times"></i>
              <h3>No appointments found</h3>
              <p>No appointments match the selected filter.</p>
              <a href="index.html#appointments" class="apt-book-cta">
                <i class="fas fa-calendar-plus"></i> Book an Appointment
              </a>
            </div>`;
          return;
        }

        listEl.innerHTML = filtered
          .map((apt) => {
            const fullTime =
              apt.datetime || `${apt.date}T${apt.time || "00:00"}:00`;
            const isPast = getAppointmentDate(apt) < new Date();
            const doctorName = escapeHtml(
              apt.doctor_name || apt.doctor || "Doctor"
            );
            const statusLabel =
              apt.status.charAt(0).toUpperCase() + apt.status.slice(1);

            return `
                <div class="appointment-card" data-id="${apt.id}">
                  <div class="appointment-info">
                    <h4><i class="fas fa-user-md"></i> ${doctorName}</h4>
                    <div class="appointment-date" data-time="${fullTime}"></div>
                    ${
                      apt.reason
                        ? `<p class="appointment-reason"><i class="fas fa-notes-medical"></i> ${escapeHtml(apt.reason)}</p>`
                        : ""
                    }
                    <span class="status-badge ${apt.status}">${statusLabel}</span>
                  </div>
                  <div class="appointment-actions">
                    ${getActionHtml(apt, isPast)}
                  </div>
                </div>`;
          })
          .join("");

        // Immediately update formatting after injection
        updateAppointmentTimes();

        listEl.querySelectorAll(".cancel-btn").forEach((btn) => {
          btn.addEventListener("click", () =>
            cancelAppointment(btn.dataset.aptId, btn)
          );
        });
      }

      // ---- Cancel ----
      async function cancelAppointment(appointmentId, btnElement) {
        const ok = await aptConfirm(
          "Cancel this appointment? This cannot be undone."
        );
        if (!ok) return;

        btnElement.innerText = "Cancelling...";
        btnElement.disabled = true;

        if (!navigator.onLine) {
          showToast("You appear to be offline. Please try again.", "error");
          btnElement.innerText = "Cancel";
          btnElement.disabled = false;
          return;
        }

        const userId = getUserId();

        try {
          const response = await fetch(
            `${CONFIG.API_BASE_URL}/appointments/${appointmentId}/cancel?user_id=${encodeURIComponent(userId)}`,
            { method: "POST" }
          );
          const data = await response.json();

          if (data.success) {
            const apt = appointments.find((a) => String(a.id) === String(appointmentId));
            if (apt) apt.status = "cancelled";
            localStorage.setItem(
              "medicsense_appointments",
              JSON.stringify(appointments)
            );

            const card = document.querySelector(
              `.appointment-card[data-id="${appointmentId}"]`
            );
            if (card) {
              card.style.transition = "opacity 0.3s ease, transform 0.3s ease";
              card.style.opacity = "0";
              card.style.transform = "translateY(-10px)";
              setTimeout(() => {
                updateStats();
                renderAppointments();
              }, 300);
            } else {
              updateStats();
              renderAppointments();
            }
            showToast("Appointment cancelled", "success");
          } else {
            showToast(data.message || "Failed to cancel appointment", "error");
            btnElement.innerText = "Cancel";
            btnElement.disabled = false;
          }
        } catch (error) {
          console.error("Error cancelling:", error);
          showToast("Error connecting to server. Please try again.", "error");
          btnElement.innerText = "Cancel";
          btnElement.disabled = false;
        }
      }

      // ---- Cancel All ----
      async function cancelAllAppointments() {
        const confirmed = appointments.filter((a) => a.status === "confirmed");
        if (confirmed.length === 0) {
          showToast("No confirmed appointments to cancel.", "info");
          return;
        }

        const ok = await aptConfirm(
          `Cancel all ${confirmed.length} confirmed appointment(s)? This cannot be undone.`
        );
        if (!ok) return;

        const btn = document.getElementById("cancelAllBtn");
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cancelling...';
        btn.disabled = true;

        const userId = getUserId();
        let successCount = 0;

        for (const apt of confirmed) {
          try {
            const response = await fetch(
              `${CONFIG.API_BASE_URL}/appointments/${apt.id}/cancel?user_id=${encodeURIComponent(userId)}`,
              { method: "POST" }
            );
            const data = await response.json();
            if (data.success) {
              apt.status = "cancelled";
              successCount++;
            }
          } catch (e) {
            console.error(`Failed to cancel ${apt.id}:`, e);
          }
        }

        localStorage.setItem(
          "medicsense_appointments",
          JSON.stringify(appointments)
        );
        updateStats();
        renderAppointments();
        btn.innerHTML =
          '<i class="fas fa-times-circle"></i> Cancel All Confirmed';
        btn.disabled = false;
        showToast(
          `Cancelled ${successCount} of ${confirmed.length} appointment(s)`,
          successCount === confirmed.length ? "success" : "info"
        );
      }

      // ---- Tab Switching ----
      document.getElementById("filterTabs").addEventListener("click", (e) => {
        const tab = e.target.closest(".apt-filter-tab");
        if (!tab) return;
        document
          .querySelectorAll(".apt-filter-tab")
          .forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        activeFilter = tab.dataset.filter;
        renderAppointments();
      });

      // ---- Init ----
      document.addEventListener("DOMContentLoaded", () => {
        loadAppointments().catch((error) => {
          console.error("Error in loadAppointments:", error);
          const listEl = document.getElementById("appointmentList");
          if (listEl) {
            listEl.innerHTML = `
              <div class="apt-empty-state">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>Error loading appointments</h3>
                <p>Please refresh the page or try again later.</p>
              </div>`;
          }
        });
      });
    </script>
  <script src="live-clock.js"></script>
</body>
</html>
